name: Wardrop project CI

on:
  push:
    paths:
      - 'projects/wardrop-traffic-assignment-variational-inequality/**'
      - '.github/workflows/wardrop-project.yml'
  pull_request:
    paths:
      - 'projects/wardrop-traffic-assignment-variational-inequality/**'
      - '.github/workflows/wardrop-project.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/wardrop-traffic-assignment-variational-inequality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: pytest
