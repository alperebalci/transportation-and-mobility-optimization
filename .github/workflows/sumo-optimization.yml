name: SUMO Optimization Core
on:
  pull_request:
    paths: ["projects/sumo-traffic-simulation-optimization/**",".github/workflows/sumo-optimization.yml"]
  push:
    branches: [main]
    paths: ["projects/sumo-traffic-simulation-optimization/**"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/sumo-traffic-simulation-optimization
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
